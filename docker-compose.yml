services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: underlined
      POSTGRES_PASSWORD: underlined
      POSTGRES_DB: underlined_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underlined -d underlined_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's Docker Hub/Quay images were pulled behind a login wall, so local
  # dev uses S3Mock (Apache-licensed, no auth) as the S3-compatible fake
  # instead — same ObjectStorePort/ex_aws client code either way.
  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: avatars
    ports:
      - "9000:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Postgres web UI. Not pre-wired to any database — log in through its web
  # form with whichever DATABASE_URL you need (dev's postgres service, or
  # Gigalixir's production DB) so no credentials have to live in this file.
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"

  api:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      MIX_ENV: dev
      DATABASE_URL: ecto://underlined:underlined@postgres/underlined_dev
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: dev_secret_key_base_change_me_dev_secret_key_base_change_me
      GUARDIAN_SECRET_KEY: dev_guardian_secret_change_me_dev_guardian_secret_change_me
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_ENDPOINT: http://s3mock:9090
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET: avatars
      S3_REGION: us-east-1
      CORS_ORIGIN: http://localhost:3000
      PHX_HOST: localhost
      PORT: "4000"
      # The standalone HealthyCommunity repo's own docker-compose stack
      # (see its roadmap.md Part B, Step 1) exposes its "app" service on
      # host port 4100; host.docker.internal lets this container reach it
      # without the two compose projects sharing a network. Off by default
      # (fails closed via Api.Infrastructure.CommunityHealthNoop) — set
      # COMMUNITY_HEALTH_ENABLED=true and COMMUNITY_HEALTH_API_KEY (from
      # `mix community_health.register_platform "Underlined"` in that repo)
      # to turn it on.
      COMMUNITY_HEALTH_ENABLED: ${COMMUNITY_HEALTH_ENABLED:-false}
      COMMUNITY_HEALTH_API_URL: ${COMMUNITY_HEALTH_API_URL:-}
      COMMUNITY_HEALTH_API_KEY: ${COMMUNITY_HEALTH_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - api_build:/app/_build
      - api_deps:/app/deps

  web:
    build:
      context: ./web
    depends_on:
      - api
    environment:
      NUXT_API_BASE_URL: http://api:4000
      NUXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  api_build:
  api_deps:
  web_node_modules:
